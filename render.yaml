databases:
  - name: learning-path-db
    databaseName: learning_path
    user: learning_path
    plan: basic-256mb
    region: oregon

services:
  - type: web
    name: ai-learning-path-optimizer
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    preDeployCommand: alembic upgrade head
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: learning-path-db
          property: connectionString
      - key: MODEL_DIR
        value: /app/outputs/models
      - key: ALLOWED_ORIGINS
        value: https://ai-learning-path-optimizer.onrender.com
