[tool.ruff]
line-length = 100
target-version = "py314"
exclude = ["static/chart.umd.min.js", "outputs", ".venv", ".venv-1"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"] # FastAPI dependency injection uses call defaults by design.

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
files = ["app"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = false
exclude = ["migrations/", "tests/"]

[[tool.mypy.overrides]]
module = ["src", "src.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["jose", "jose.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/__init__.py", "app/services/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
